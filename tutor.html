<!DOCTYPE html>
<html>
<head>
    <title>AI Tutor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sidebar">

    <div class="logo-box">
        <div class="logo-circle">M</div>
        <h2>Marco AI Tutor</h2>
    </div>

    <a href="dashboard.html">Dashboard</a>
    <a href="upload.html">Upload Notes</a>
    <a href="summary.html">Summary</a>
    <a href="quiz.html">Quiz Generator</a>
    <a href="tutor.html" class="active">AI Tutor</a>
    <a href="#" onclick="logoutUser()">Logout</a>

    <button
        type="button"
        class="theme-toggle"
        onclick="toggleTheme()"
    >
        Toggle Theme
    </button>

</div>

<div class="main">

    <div class="hero-header">
        <h1>Ask Marco</h1>
        <p>Your personal AI study assistant is ready to help.</p>
    </div>

    <div class="result-box">

        <h3>Ask a Question</h3>

        <input
            type="text"
            id="tutorQuestion"
            placeholder="Example: What is process management?"
        >

        <button
            type="button"
            onclick="askTutor()"
        >
            Ask Question
        </button>

        <p id="tutorMessage"></p>

        <div
            id="tutorAnswer"
            class="answer"
        >
            Ask Marco a question about your saved study material.
        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
